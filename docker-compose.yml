# Image tags: deploy/deploy.sh exports IMAGE_TAG=<full git sha> in the remote
# shell before `docker compose up`, so every deploy runs an exact, immutable
# build (and deploy/rollback.sh can go back to the previous one). Without it
# the stack falls back to :latest. The server's .env is NOT used for this.
#
# Resource limits are sized for the single production VPS (2 vCPU, ~3.9 GB
# RAM) and leave ~1.5 GB for the host and peaks of the one-shot migrate.
#
# `web` MUST stay a single replica: the game scheduler, rate limits, TTL
# caches and the auction SSE fan-out all live in that one process's memory.
# Never `--scale web=N`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    image: ${IMAGE_BASE:-ghcr.io/omidazg/founders-arena}-migrate:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - /srv/arena/data:/app/data
    restart: "no"
    mem_limit: 1g
    cpus: 1.5
    logging: *default-logging

  web:
    image: ${IMAGE_BASE:-ghcr.io/omidazg/founders-arena}-web:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
      UPLOAD_DIR: /app/data/uploads
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      # Heap cap below mem_limit so V8 GCs before the kernel OOM-kills the
      # container (native memory: sharp/libvips, sqlite page cache, buffers).
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - /srv/arena/data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5
    expose:
      - "3000"
    healthcheck:
      # Full health (db + scheduler, 503 when unhealthy); see src/app/api/health.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # Periodic online SQLite backups (see scripts/backup.mjs and docs/ops.md).
  # Reuses the SAME prebuilt image as `migrate` (the Dockerfile's `tools`
  # target: full node_modules incl. better-sqlite3), overriding its
  # entrypoint so it runs the backup loop instead of the one-shot
  # migrate/seed script. It must not declare `build:` -- images are built
  # in GitHub Actions and only pulled here, because this server's network
  # can't reliably reach registry.npmjs.org. backup.mjs isn't baked into
  # the image (only prisma/src are), so it's bind-mounted in directly.
  backup:
    image: ${IMAGE_BASE:-ghcr.io/omidazg/founders-arena}-migrate:${IMAGE_TAG:-latest}
    # Same command as before (node /app/scripts/backup.mjs), but through the
    # image's privilege drop (docker/drop-privs.sh) so the backup runs as the
    # same `node` user as web/migrate: a root-owned dev.db-wal/-shm created by
    # this container would make the db read-only for web. CHOWN_DIRS also hands
    # /backups to that user so retention can still delete old files. The `-x`
    # test keeps backups working if an older image without drop-privs.sh is
    # deployed (deploy/rollback.sh) -- it then simply runs as root, as before.
    entrypoint: ["/bin/sh", "-c", "if [ -x /app/docker/drop-privs.sh ]; then exec /app/docker/drop-privs.sh node /app/scripts/backup.mjs; else exec node /app/scripts/backup.mjs; fi"]
    env_file:
      - .env
    environment:
      CHOWN_DIRS: /app/data /backups
      DATABASE_URL: file:/app/data/dev.db
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_MIN: ${BACKUP_INTERVAL_MIN:-15}
      BACKUP_KEEP: ${BACKUP_KEEP:-96}
    volumes:
      # The backup API only needs to read /app/data, but better-sqlite3
      # readers on a WAL-mode db still write read-mark bytes into the
      # -shm file to coordinate with writers/checkpoints, so a read-only
      # mount here breaks online backups. Mounted read-write on purpose.
      - /srv/arena/data:/app/data
      - /srv/arena/backups:/backups
      - ./scripts/backup.mjs:/app/scripts/backup.mjs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  caddy:
    # Pinned (was caddy:2): a new Caddy minor must not arrive unannounced on a
    # routine deploy. Pulled through the server's registry mirror.
    image: caddy:2.11.4
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Old http://<IP> links -> the domain, once deploy/enable-domain.sh has
      # set these in .env. The defaults make that Caddyfile block a no-op.
      LEGACY_HTTP_ADDRESS: ${LEGACY_HTTP_ADDRESS:-http://legacy.invalid}
      LEGACY_REDIRECT_TO: ${LEGACY_REDIRECT_TO:-https://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
