services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - /srv/arena/data:/app/data
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    volumes:
      - /srv/arena/data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/phase').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
