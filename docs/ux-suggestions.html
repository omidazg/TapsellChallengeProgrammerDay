<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پیشنهادهای بهبود تجربه کاربری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f0f2f8; --border:#e2e5ee; --text:#161a26; --muted:#5d6477;
  --accent:#4f46e5; --accent-soft:#eceafe; --accent-text:#ffffff;
  --high:#c2410c; --high-soft:#fff1e8; --mid:#a16207; --mid-soft:#fdf6e0; --low:#15803d; --low-soft:#e9f8ee;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1017; --surface:#171a24; --surface-2:#1f2330; --border:#2b3040; --text:#eceef5; --muted:#9aa1b5;
    --accent:#8b83ff; --accent-soft:#25234a; --accent-text:#0e1017;
    --high:#fb923c; --high-soft:#3a2214; --mid:#facc15; --mid-soft:#352d10; --low:#4ade80; --low-soft:#123020;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1017; --surface:#171a24; --surface-2:#1f2330; --border:#2b3040; --text:#eceef5; --muted:#9aa1b5;
  --accent:#8b83ff; --accent-soft:#25234a; --accent-text:#0e1017;
  --high:#fb923c; --high-soft:#3a2214; --mid:#facc15; --mid-soft:#352d10; --low:#4ade80; --low-soft:#123020;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.75;font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 120px}
header h1{font-size:26px;font-weight:800;margin:0 0 6px}
header p{margin:0;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);min-width:120px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{color:var(--muted);font-size:13px}
.toolbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:12px 0;margin-top:10px;border-bottom:1px solid var(--border)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row + .row{margin-top:8px}
input[type=search],select{font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-height:40px}
input[type=search]{flex:1 1 220px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;min-height:40px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 12px;min-height:32px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:700}
.group{margin-top:26px}
.group h2{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.group h2 small{color:var(--muted);font-weight:500;font-size:13px}
.group h2 button{font-size:12px;padding:2px 10px;min-height:28px;margin-inline-start:auto}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,background .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.card.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.card input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent);cursor:pointer}
.card h3{margin:0;font-size:16px;font-weight:700}
.card p{margin:4px 0 8px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.tag.p-high{background:var(--high-soft);color:var(--high);border-color:transparent;font-weight:700}
.tag.p-mid{background:var(--mid-soft);color:var(--mid);border-color:transparent;font-weight:700}
.tag.p-low{background:var(--low-soft);color:var(--low);border-color:transparent;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--muted)}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.bar .inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .count{font-weight:700;margin-inline-end:auto}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){
  header h1{font-size:21px}
  .card{padding:12px}
  .toolbar{position:static}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{min-width:0;padding:8px 10px}
  .stat b{font-size:18px}
  .bar .inner{flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;gap:6px;scrollbar-width:none}
  .bar .count{white-space:nowrap;font-size:13px}
  .bar button{flex:0 0 auto;white-space:nowrap;padding:6px 12px;min-height:36px;font-size:13px}
}
@media print{
  .toolbar,.bar,.toast,.group h2 button,.card input{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid}
  body.print-selected .card:not(.sel){display:none}
  body.print-selected .group.nosel{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>پیشنهادهای بهبود تجربه کاربری و ظاهر سایت</h1>
    <p>حاصل بررسی موازی کد و مرور زنده‌ی صفحه‌ها. موارد دلخواه را تیک بزنید و خروجی بگیرید. انتخاب‌ها در همین مرورگر ذخیره می‌شوند.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="row">
      <input type="search" id="q" placeholder="جستجو در عنوان و توضیح…" aria-label="جستجو">
      <select id="sort" aria-label="مرتب‌سازی">
        <option value="area">گروه‌بندی بر اساس بخش</option>
        <option value="cat">گروه‌بندی بر اساس دسته</option>
        <option value="prio">گروه‌بندی بر اساس اولویت</option>
      </select>
      <button id="theme" type="button" aria-label="تغییر تم">🌓</button>
    </div>
    <div class="row"><span style="color:var(--muted);font-size:13px">اولویت:</span><div class="chips" id="f-prio"></div></div>
    <div class="row"><span style="color:var(--muted);font-size:13px">تلاش:</span><div class="chips" id="f-effort"></div></div>
    <div class="row"><span style="color:var(--muted);font-size:13px">دسته:</span><div class="chips" id="f-cat"></div></div>
  </div>

  <main id="groups"></main>
</div>

<div class="bar"><div class="inner">
  <span class="count" id="count">۰ مورد انتخاب شده</span>
  <button type="button" id="all">انتخاب همه‌ی نمایش‌داده‌ها</button>
  <button type="button" id="none">پاک کردن انتخاب</button>
  <button type="button" id="copy">کپی متن</button>
  <button type="button" id="md">دانلود Markdown</button>
  <button type="button" id="csv">دانلود CSV</button>
  <button type="button" id="json">دانلود JSON</button>
  <button type="button" class="primary" id="print">چاپ / PDF انتخاب‌شده‌ها</button>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = [{"id":"s1","title":"برچسب درست برای صفحه‌های قفل","desc":"در صفحه‌های ایده، ساخت، سرمایه‌گذاری و بازار به‌جای «فاز فعلی» نوشته شود «از فاز X باز می‌شود» با شمارش معکوس، و دکمهٔ «الان چه کنم؟» به کار فعلی (مثلاً اتاق تیم) لینک بدهد.","area":"عمومی و پوسته","cat":"متن و محتوا","prio":"بالا","effort":"کم"},{"id":"s2","title":"«کار بعدی» هوشمندتر در صفحهٔ اصلی","desc":"وقتی تیم کامل است و سرپرست انتخاب نشده، کارت خانه بگوید «به سرپرست تیم رأی بده» و به اتاق تیم لینک بدهد؛ الان حتی با پروفایل کامل «شخصیتت را کامل کن» تکرار می‌شود.","area":"صفحهٔ اول و خانه","cat":"تجربه کاربری","prio":"بالا","effort":"کم"},{"id":"s3","title":"پیش‌فرض تم «سیستم» و تکمیل تم تیره","desc":"پیش‌فرض تم روشن است و ترجیح سیستم نادیده گرفته می‌شود؛ پیش‌فرض «سیستم» شود و رنگ‌های جاافتاده درست شوند: قرمز روی زمینهٔ تیره، نوار سفید لوگوها در فوتر، چیپ‌های روشن امتیاز و دکمهٔ ثانویهٔ ۴۰۴.","area":"عمومی و پوسته","cat":"دسترس‌پذیری","prio":"بالا","effort":"متوسط"},{"id":"s4","title":"یکدست کردن نام بخش‌ها و ترتیب منو","desc":"منو «سرمایه‌گذاری»، عنوان صفحه «طبقهٔ سرمایه‌گذاری» و نقشهٔ مسیر «دور سرمایه‌گذاری» می‌گوید؛ هر بخش یک نام داشته باشد و ترتیب منو با ترتیب مسیر بازی یکی شود.","area":"عمومی و پوسته","cat":"متن و محتوا","prio":"متوسط","effort":"کم"},{"id":"s5","title":"برچسب و tooltip برای چیپ کیف پول در هدر دسکتاپ","desc":"در دسکتاپ فقط چیپ بی‌عنوان «🌱 ۱۰۰ | 🛒 ۱۰۰» دیده می‌شود؛ aria-label و tooltip «کیف پول: بذر ۱۰۰، خرید ۱۰۰» و لینک به صفحهٔ کیف پول بگیرد.","area":"عمومی و پوسته","cat":"دسترس‌پذیری","prio":"متوسط","effort":"کم"},{"id":"s6","title":"پیش‌نمایش جریمهٔ روشن‌تر در کیف پول","desc":"وقتی جریمه صفر است عدد قرمز «۰ امتیاز» و دو جملهٔ متناقض دیده می‌شود؛ عدد خنثی یا سبز و یک جملهٔ ساده: «الان جریمه‌ای نداری؛ اگر X سکه خرج نشود تا Y امتیاز کم می‌شود».","area":"حراج و کیف پول","cat":"متن و محتوا","prio":"متوسط","effort":"کم"},{"id":"s7","title":"جدول امتیاز در حالت مساوی","desc":"وقتی همهٔ امتیازها صفر است مدال و «۰ عقب‌تر» نشان داده نشود و پیام «هنوز رقابت شروع نشده» بیاید؛ نام تیم‌ها روی سکو در موبایل هم بریده نشود.","area":"جدول و سالن","cat":"ظاهر و حس","prio":"متوسط","effort":"کم"},{"id":"s8","title":"کارت سرپرست تیم بالاتر در موبایل","desc":"در موبایل کارت «سرپرست تیم» زیر اعضا و دعوت می‌آید در حالی که مهم‌ترین کار باقی‌ماندهٔ فاز است؛ بالای فهرست اعضا بیاید یا بنر «هنوز سرپرست ندارید» نمایش داده شود.","area":"تیم","cat":"موبایل","prio":"متوسط","effort":"کم"},{"id":"s9","title":"کم‌رنگ‌کردن دکمهٔ «ترک تیم»","desc":"«ترک تیم» درست کنار دکمهٔ اصلی و هم‌اندازهٔ آن است؛ به لینک متنی کوچک یا منوی «…» منتقل شود و تأیید بخواهد.","area":"تیم","cat":"تجربه کاربری","prio":"متوسط","effort":"کم"},{"id":"s10","title":"رفع تناقض «چهار روز، چهار مرحله»","desc":"صفحهٔ اول این تیتر را دارد ولی مسیر زیرش ۷ مرحله نشان می‌دهد؛ تیتر اصلاح شود یا مراحل روزبه‌روز گروه‌بندی شوند.","area":"صفحهٔ اول و خانه","cat":"متن و محتوا","prio":"متوسط","effort":"کم"},{"id":"s11","title":"جابه‌جایی لوگوها در صفحهٔ اول موبایل","desc":"در موبایل شبکهٔ ۲۰ لوگو حدود ۷ ردیف است و مسیر بازی و امتیازدهی را پایین می‌برد؛ لوگوها بعد از «چطور برنده می‌شویم» بیایند یا یک ردیف اسکرولی شوند.","area":"صفحهٔ اول و خانه","cat":"موبایل","prio":"متوسط","effort":"کم"},{"id":"s12","title":"یک دکمهٔ اصلی در صفحهٔ اول","desc":"«ثبت‌نام / ورود / راهنما» هم در هدر و هم در hero تکرار شده؛ در hero یک دکمهٔ اصلی باشد و «زمان باقی‌مانده: بدون زمان‌بندی» وقتی زمان‌بندی نیست پنهان شود.","area":"صفحهٔ اول و خانه","cat":"ظاهر و حس","prio":"پایین","effort":"کم"},{"id":"s13","title":"متن ساده به‌جای «لیست سفید»","desc":"«لیست سفید» برای کاربر عادی مبهم است؛ «ایمیلت هنوز تأیید نشده؟» نوشته شود و در درخواست دسترسی زمان تقریبی بررسی و روش اطلاع‌رسانی گفته شود.","area":"ورود و ثبت‌نام","cat":"متن و محتوا","prio":"متوسط","effort":"کم"},{"id":"s14","title":"مسیر فراموشی رمز","desc":"فرم ورود لینک «رمز را فراموش کرده‌ام» ندارد؛ دست‌کم ورود با کد پیامکی یا راه تماس با برگزارکننده پیشنهاد شود.","area":"ورود و ثبت‌نام","cat":"تجربه کاربری","prio":"متوسط","effort":"متوسط"},{"id":"s15","title":"فیلدهای اجباری و یکسان در درخواست دسترسی","desc":"مشخص شود کدام فیلد اجباری است؛ «واحد سازمانی» با فهرست دپارتمان ثبت‌نام یکی شود و فیلد «پیلار / شرکت» اضافه شود.","area":"ورود و ثبت‌نام","cat":"تجربه کاربری","prio":"پایین","effort":"کم"},{"id":"s16","title":"رنگ یکسان برای گزینهٔ انتخاب‌شده","desc":"در پروفایل نقش انتخاب‌شده قاب قرمز (حس خطا) و قدرت انتخاب‌شده قاب فیروزه‌ای دارد؛ هر دو یک رنگ و تیک ✓ داشته باشند.","area":"پروفایل","cat":"ظاهر و حس","prio":"پایین","effort":"کم"},{"id":"s17","title":"ارقام فارسی شمارهٔ موبایل و کامل‌شدن کارت اشتراک","desc":"شمارهٔ موبایل با رقم لاتین نمایش داده می‌شود؛ فارسی شود، کارت اشتراک «اعتمادبه‌نفس» را هم داشته باشد و نشان «سحرخیز» توضیح بگیرد.","area":"پروفایل","cat":"متن و محتوا","prio":"پایین","effort":"کم"},{"id":"s18","title":"فشرده‌کردن کارت‌های کیف در موبایل","desc":"سه کارت کیف بذر، کیف خرید و خزانه در موبایل یک صفحهٔ کامل را می‌گیرند؛ در صفحهٔ خانه یک ردیف سه‌ستونی کوچک شوند.","area":"صفحهٔ اول و خانه","cat":"موبایل","prio":"پایین","effort":"کم"},{"id":"s19","title":"راه برگشت از نمای سالن","desc":"نمای سالن هیچ راه برگشتی ندارد؛ دکمهٔ کوچک «خروج از نمای سالن» که در حالت تمام‌صفحه پنهان شود.","area":"جدول و سالن","cat":"تجربه کاربری","prio":"پایین","effort":"کم"},{"id":"s20","title":"یکدستی واژه‌ها: «سؤال» و «پرسش‌های متداول»","desc":"«سوالات پرتکرار» در صفحهٔ اول با «سؤال‌وجواب» در دستیار ناهمخوان است؛ یک واژه و املای یکسان انتخاب شود.","area":"عمومی و پوسته","cat":"متن و محتوا","prio":"پایین","effort":"کم"},{"id":"s21","title":"نوار ناوبری پایین در موبایل","desc":"منوی همبرگر ۱۱ مقصد دارد؛ یک نوار تب ثابت پایین با «خانه / اتاق تیم / مقصد فاز جاری / جدول / بیشتر» دسترسی را یک‌لمسی می‌کند.","area":"عمومی و پوسته","cat":"موبایل","prio":"بالا","effort":"متوسط"},{"id":"s22","title":"منوی آگاه از فاز","desc":"آیتم مربوط به فاز جاری در منو نقطهٔ تپنده بگیرد و آیتم‌های فازهای آینده کم‌رنگ با راهنمای «از فاز X باز می‌شود» نمایش داده شوند.","area":"عمومی و پوسته","cat":"تجربه کاربری","prio":"بالا","effort":"کم"},{"id":"s23","title":"زمان باقی‌ اری بومی لینک دعوت","desc":"در موبایل کنار «کپی لینک دعوت» از navigator.share استفاده شود تا لینک مستقیم در پیام‌رسان‌ها فرستاده شود.","area":"تیم","cat":"موبایل","prio":"بالا","effort":"کم"},{"id":"s55","title":"لغو دعوت‌نامه‌های در انتظار","desc":"در فهرست «دعوت‌های در انتظار پاسخ» برای هر ایمیل دکمهٔ «لغو» باشد؛ الان دعوت اشتباه تا ابد در فهرست می‌ماند.","area":"تیم","cat":"تجربه کاربری","prio":"متوسط","effort":"متوسط"},{"id":"s56","title":"شمارندهٔ نویسه و مثال در فرم ایده","desc":"زیر «مسئله»، «مخاطب» و «برنامهٔ ساخت» شمارندهٔ ۰/۲۰۰۰ و یک مثال کوتاه بیاید تا تیم بداند چقدر بنویسد.","area":"ایده","cat":"متن و محتوا","prio":"متوسط","effort":"کم"},{"id":"s57","title":"ذخیرهٔ خودکار پیش‌نویس ایده و محصول","desc":"فرم ایده و مرکز ساخت هر ۳۰ ثانیه یا هنگام blur در مرورگر ذخیره و با بنر «پیش‌نویس ذخیره‌نشده بازیابی شود؟» برگردانده شود؛ بستن تصادفی تب کار تیم را از بین می‌برد.","area":"ایده","cat":"تجربه کاربری","prio":"بالا","effort":"متوسط"},{"id":"s58","title":"اعتبارسنجی آنی نشانی تصویر","desc":"هنگام «افزودن» تصویر، اگر نشانی مجاز نیست همان‌جا خطا داده شود؛ الان فقط موقع ذخیره پیام کلی «یکی از نشانی‌ها مجاز نیست» می‌آید.","area":"ساخت محصول","cat":"تجربه کاربری","prio":"بالا","effort":"کم"},{"id":"s59","title":"چک‌لیست قابل‌کلیک در مرکز ساخت","desc":"هر آیتم چک‌لیست به فیلد مربوط اسکرول و فوکوس کند و وقتی ثبت نهایی به خاطر چک‌لیست رد شد، موارد ناقص در پیام خطا نام برده شوند.","area":"ساخت محصول","cat":"تجربه کاربری","prio":"بالا","effort":"کم"},{"id":"s60","title":"مرتب‌سازی تصاویر و برچسب «کاور»","desc":"امکان جابه‌جایی تصاویر محصول و برچسب «کاور» روی تصویر اول، چون اولین تصویر کاور بازار است و کاربر این را نمی‌داند.","area":"ساخت محصول","cat":"ظاهر و حس","prio":"متوسط","effort":"متوسط"},{"id":"s61","title":"ورودی عددی کنار اسلایدرهای قیمت","desc":"اسلایدر قیمت و قیمت شروع حراج و سهم سود در موبایل دقیق تنظیم نمی‌شود؛ ورودی عددی کوچک یا دکمه‌های +/− کنارش باشد.","area":"ساخت محصول","cat":"موبایل","prio":"متوسط","effort":"کم"},{"id":"s62","title":"غیرفعال‌کردن «پیش‌نمایش صفحهٔ محصول» پیش از اولین ذخیره","desc":"پیش از اولین ذخیره این لینک به صفحهٔ ۴۰۴ می‌رسد؛ غیرفعال شود یا متن «اول پیش‌نویس را ذخیره کن» نمایش داده شود.","area":"ساخت محصول","cat":"تجربه کاربری","prio":"متوسط","effort":"کم"},{"id":"s63","title":"«ارزیابی نشد» به‌جای ۰٪ در کارت تحلیل‌گر","desc":"اگر یکی از نمره‌های تحلیل‌گر خالی است ۰٪ نشان داده می‌شود که تیم را ناامید می‌کند؛ «—» یا «ارزیابی نشد» نوشته شود.","area":"ایده","cat":"متن و محتوا","prio":"پایین","effort":"کم"},{"id":"s64","title":"دیالوگ تأیید درون‌برنامه‌ای به‌جای confirm مرورگر","desc":"برای «ترک تیم»، «رد دعوت» و قدرت‌های یک‌بارمصرف یک دیالوگ RTL با دکمهٔ قرمز ساخته شود؛ confirm پیش‌فرض مرورگر فارسی و راست‌به‌چپ نیست.","area":"عمومی و پوسته","cat":"ظاهر و حس","prio":"متوسط","effort":"متوسط"},{"id":"s65","title":"رنگ درست برای چیپ نقش اعضا","desc":"نقش همهٔ اعضا با رنگ قرمز (رنگ خطا) نمایش داده می‌شود؛ هر نقش رنگ اختصاصی یا خنثی بگیرد تا با هشدار «نقش خالی» اشتباه نشود.","area":"تیم","cat":"ظاهر و حس","prio":"پایین","effort":"کم"},{"id":"s66","title":"توضیح «بعد از ثبت نهایی چه می‌شود»","desc":"کنار دکمهٔ ثبت نهایی ایده/محصول یک خط توضیح بیاید: تحلیل‌گر یا داور AI چند ثانیه طول می‌کشد و تا پایان فاز قابل بازکردن است.","area":"ایده","cat":"متن و محتوا","prio":"پایین","effort":"کم"},{"id":"s67","title":"ایموجی حالت در نظرسنجی","desc":"به‌جای اعداد ۱ تا ۵ از ایموجی حالت با برچسب متنی استفاده شود و پس از ثبت، پیام تشکر بزرگ‌تر با لینک به نتایج نمایش داده شود.","area":"نظرسنجی و نتایج","cat":"ظاهر و حس","prio":"پایین","effort":"کم"},{"id":"s68","title":"نمایش موجودی کیف خرید در پنل خرید","desc":"در PurchasePanel کنار دکمهٔ «خرید» موجودی کیف خرید و «موجودی پس از خرید» نمایش داده شود و اگر موجودی کافی نیست دکمه غیرفعال شود تا کاربر با خطای سرور روبه‌رو نشود.","area":"بازار","cat":"تجربه کاربری","prio":"بالا","effort":"کم"},{"id":"s69","title":"ورودی عددی و دکمه‌های سریع کنار اسلایدر سرمایه‌گذاری","desc":"در InvestPanel تنظیم مبلغ‌های بزرگ با اسلایدر و +/− کند است؛ یک فیلد عددی (inputMode=numeric) و دکمه‌ ست‌وجو، صفحه‌بندی و فیلتر (ادمین/مسدود/بی‌تیم) نشان می‌دهد؛ الگوی جست‌وجوی لیست سفید اینجا هم بیاید.","area":"پنل ادمین","cat":"تجربه کاربری","prio":"بالا","effort":"کم"},{"id":"s100","title":"پیش‌نمایش موجودی پس از تغییر کیف","desc":"کنار ورودی افزودن/کسر سکه موجودی بعد از اعمال زنده نمایش داده شود و دو دکمهٔ جدای «افزودن» و «کسر» به‌جای عدد منفی باشد.","area":"پنل ادمین","cat":"تجربه کاربری","prio":"متوسط","effort":"کم"},{"id":"s101","title":"برچسب فارسی فیلترهای گزارش کارها","desc":"فیلتر حوزه در ‎/admin/audit‎ نام‌های فنی (team، user، phase) نشان می‌دهد؛ نگاشت فارسی و فیلتر بر اساس «عامل» و بازهٔ تاریخ اضافه شود.","area":"پنل ادمین","cat":"متن و محتوا","prio":"متوسط","effort":"کم"},{"id":"s102","title":"محور ساعت و tooltip برای نمودار فعالیت","desc":"نمودار «اوج فعالیت» محور زمان و tooltip ندارد و جهتش در RTL گنگ است؛ برچسب ساعت زیر میله‌ها و title روی هر میله اضافه شود.","area":"پنل ادمین","cat":"دسترس‌پذیری","prio":"متوسط","effort":"کم"},{"id":"s103","title":"هشدار در صفحهٔ داوری پس از تسویه","desc":"پس از تسویه نمرهٔ داوری اثری ندارد ولی فرم «ذخیره شد» می‌گوید؛ هشدار بالای صفحه، غیرفعال‌شدن فرم و نمایش «نمره‌نگرفته: n محصول» لازم است.","area":"پنل ادمین","cat":"تجربه کاربری","prio":"متوسط","effort":"کم"},{"id":"s104","title":"دکمه‌های بزرگ‌تر برای اعضا در مدیریت تیم‌ها","desc":"دکمه‌های ↪ و ✕ کنار عضو زیر ۲۴ پیکسل‌اند و select یازده‌پیکسلی روی موبایل عملاً غیرقابل‌استفاده است؛ حداقل ۴۰ پیکسل و منوی «اقدامات» برای هر عضو.","area":"پنل ادمین","cat":"موبایل","prio":"بالا","effort":"کم"},{"id":"s105","title":"ستون ثابت در جدول تسویه روی موبایل","desc":"جدول ریزامتیاز ۹۰۰ پیکسلی فقط اسکرول افقی دارد و نام تیم ثابت نمی‌ماند؛ ستون اول sticky یا نمای کارتی شود.","area":"پنل ادمین","cat":"موبایل","prio":"متوسط","effort":"کم"},{"id":"s106","title":"واحد و حداقل مقدار در فرم زمان‌بند","desc":"فیلدهای مدت فاز واحد ندارند و ۰ را می‌پذیرند (فاز صفرساعته)؛ پسوند «ساعت»، حداقل ۱ و توضیح کوتاه زیر هر فیلد اضافه شود.","area":"پنل ادمین","cat":"متن و محتوا","prio":"متوسط","effort":"کم"},{"id":"s107","title":"نام فایل تاریخ‌دار و زمان شمسی در خروجی‌ها","desc":"فایل‌های CSV همیشه یک نام ثابت دارند و ستون زمان UTC است؛ نام فایل با تاریخ و ستون زمان شمسی به وقت تهران خواناتر است.","area":"پنل ادمین","cat":"متن و محتوا","prio":"پایین","effort":"کم"},{"id":"s108","title":"toast یکسان برای پیام موفقیت در فرم‌های ادمین","desc":"پیام‌های سبز کوچک کنار دکمه‌ها گاهی دیده نمی‌شوند و پاک هم نمی‌شوند؛ toast یکسان پایین صفحه با aria-live بهتر است.","area":"پنل ادمین","cat":"دسترس‌پذیری","prio":"متوسط","effort":"متوسط"},{"id":"s109","title":"سؤال‌های آماده در دستیار هوشمند","desc":"زیر پیام خوشامد ۳ تا ۴ دکمهٔ سؤال پرتکرار (مثل «جریمهٔ سکهٔ خرج‌نشده چطور حساب می‌شود؟» یا «سپر چه کار می‌کند؟») قرار بگیرد تا کاربر با یک کلیک بپرسد.","area":"دستیار هوشمند و اعلان‌ها","cat":"تجربه کاربری","prio":"بالا","effort":"کم"},{"id":"s110","title":"دعوت به ورود به‌جای خطا برای مهمان‌ها در دستیار","desc":"برای کاربر واردنشده به‌جای باز شدن چت و گرفتن خطا، داخل پنل کارت «برای پرسیدن وارد شو» با دکمهٔ ورود و لینک راهنما نمایش داده شود.","area":"دستیار هوشمند و اعلان‌ها","cat":"تجربه کاربری","prio":"بالا","effort":"کم"},{"id":"s111","title":"ماندگاری گفت‌وگوی دستیار","desc":"تاریخچهٔ چت در sessionStorage بماند تا با رفتن به صفحهٔ دیگر یا بستن پنل پاک نشود، به‌همراه دکمهٔ «گفت‌وگوی تازه».","area":"دستیار هوشمند و اعلان‌ها","cat":"تجربه کاربری","prio":"متوسط","effort":"کم"},{"id":"s112","title":"اعلام پاسخ دستیار به صفحه‌خوان و حفظ فوکوس","desc":"فهرست پیام‌ها aria-live=polite شود و پس از رسیدن پاسخ، فوکوس به فیلد ورودی برگردد (الان حین ارسال غیرفعال می‌شود و فوکوس از دست می‌رود).","area":"دستیار هوشمند و اعلان‌ها","cat":"دسترس‌پذیری","prio":"متوسط","effort":"کم"},{"id":"s113","title":"قالب‌بندی ساده در پاسخ‌های دستیار","desc":"پاسخ‌ها اغلب فهرست و متن پررنگ دارند؛ رندر سبک خط‌شکنی و فهرست‌ها خوانایی پاسخ‌های چندخطی را خیلی بهتر می‌کند.","area":"دستیار هوشمند و اعلان‌ها","cat":"ظاهر و حس","prio":"متوسط","effort":"کم"},{"id":"s114","title":"نمایش سهمیهٔ باقی‌مانده و پیام خطای مهربان‌تر","desc":"وقتی سقف پیام یا بودجهٔ روزانهٔ هوش مصنوعی پر شد، با شمارش معکوس بگویید کی دوباره می‌شود پرسید و لینک راهنما کنارش باشد.","area":"دستیار هوشمند و اعلان‌ها","cat":"متن و محتوا","prio":"پایین","effort":"کم"},{"id":"s115","title":"دکمهٔ شناور دستیار روی موبایل مزاحم محتوا نشود","desc":"دکمهٔ ثابت پایین صفحه روی دکمه‌های پایین فرم‌ها (مثل ثبت پیشنهاد حراج) می‌افتد؛ در موبایل کوچک‌تر یا جابه‌جا شود و پنل به‌صورت bottom sheet تمام‌عرض باز شود.","area":"دستیار هوشمند و اعلان‌ها","cat":"موبایل","prio":"متوسط","effort":"کم"},{"id":"s116","title":"خوانده‌شدن تکی اعلان‌ها","desc":"الان باز کردن زنگوله همهٔ اعلان‌ها را خوانده می‌کند؛ اعلان‌های تازه تا کلیک یا بستن پنل پررنگ بمانند.","area":"دستیار هوشمند و اعلان‌ها","cat":"تجربه کاربری","prio":"متوسط","effort":"متوسط"},{"id":"s117","title":"پیشنهاد فعال‌سازی اعلان Push در لحظهٔ مناسب","desc":"به‌جای دکمهٔ پنهان در پروفایل، بعد از اولین پیشنهاد حراج یا عضویت در تیم بنر «وقتی پیشنهادت شکسته شد خبرت کنیم؟» نمایش داده شود؛ برای iOS راهنمای «افزودن به صفحهٔ اصلی» هم بیاید.","area":"دستیار هوشمند و اعلان‌ها","cat":"تجربه کاربری","prio":"بالا","effort":"متوسط"},{"id":"s118","title":"کلیک روی اعلان Push تب درست را باز کند","desc":"الان اولین تب باز ناوبری می‌شود حتی اگر کاربر وسط پر کردن فرم باشد؛ اول تبی با همان مسیر پیدا شود وگرنه تب تازه باز شود.","area":"دستیار هوشمند و اعلان‌ها","cat":"تجربه کاربری","prio":"متوسط","effort":"کم"},{"id":"s119","title":"صفحهٔ آفلاین کاربردی‌تر","desc":"صفحهٔ آفلاین با برگشت اینترنت خودکار بارگذاری شود و یادآوری کند کارهای ارسال‌نشده ثبت نشده‌اند؛ فونت و آیکون هم precache شوند.","area":"عمومی و پوسته","cat":"عملکرد","prio":"پایین","effort":"کم"},{"id":"s120","title":"پیش‌نمایش و نوار پیشرفت آپلود تصویر","desc":"قبل از ارسال پیش‌نمایش محلی و بررسی حجم ۵ مگابایت در مرورگر، و هنگام آپلود نوار پیشرفت تا روی Wi‑Fi شلوغ سالن فایل دوباره فرستاده نشود.","area":"ساخت محصول","cat":"تجربه کاربری","prio":"بالا","effort":"متوسط"},{"id":"s121","title":"استفاده از تصویر کوچک (thumb) در فهرست‌ها","desc":"API نسخهٔ ۴۸۰ پیکسلی می‌سازد؛ در کارت‌های بازار و سالن به‌جای تصویر ۱۶۰۰ پیکسلی از آن استفاده شود تا صفحه‌ها روی شبکهٔ شلوغ سریع‌تر باز شوند.","area":"بازار","cat":"عملکرد","prio":"بالا","effort":"کم"},{"id":"s122","title":"کاهش polling اعلان‌ها وقتی Push فعال است","desc":"اگر اشتراک Push فعال است بازهٔ polling اعلان‌ها از ۲۰ به ۶۰ ثانیه برسد تا بار ثابت روی دیتابیس کم شود.","area":"دستیار هوشمند و اعلان‌ها","cat":"عملکرد","prio":"پایین","effort":"کم"}];
const PRIOS=["بالا","متوسط","پایین"], EFFORTS=["کم","متوسط","زیاد"];
const prioClass={"بالا":"p-high","متوسط":"p-mid","پایین":"p-low"};
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const KEY="ux-suggestions-selected-v1";
let selected=new Set();
try{selected=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...selected]))}catch(e){}};
const filters={prio:new Set(),effort:new Set(),cat:new Set()};
const cats=[...new Set(DATA.map(d=>d.cat))];
const $=id=>document.getElementById(id);

function chips(el,values,set){
  el.innerHTML="";
  values.forEach(v=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=v;b.setAttribute("aria-pressed","false");
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.setAttribute("aria-pressed",set.has(v));render()};
    el.appendChild(b);
  });
}
chips($("f-prio"),PRIOS,filters.prio);chips($("f-effort"),EFFORTS,filters.effort);chips($("f-cat"),cats,filters.cat);

function visible(){
  const q=$("q").value.trim();
  return DATA.filter(d=>(!filters.prio.size||filters.prio.has(d.prio))&&(!filters.effort.size||filters.effort.has(d.effort))&&(!filters.cat.size||filters.cat.has(d.cat))&&(!q||(d.title+" "+d.desc+" "+d.area).includes(q)));
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const mode=$("sort").value, list=visible(), g=new Map();
  const keyOf=d=>mode==="cat"?d.cat:mode==="prio"?d.prio:d.area;
  const order=mode==="prio"?PRIOS:null;
  list.forEach(d=>{const k=keyOf(d);if(!g.has(k))g.set(k,[]);g.get(k).push(d)});
  const keys=order?order.filter(k=>g.has(k)):[...g.keys()];
  const rank=d=>PRIOS.indexOf(d.prio)*3+EFFORTS.indexOf(d.effort);
  const main=$("groups");main.innerHTML="";
  if(!list.length){main.innerHTML='<div class="empty">موردی با این فیلترها پیدا نشد.</div>'}
  keys.forEach(k=>{
    const items=g.get(k).sort((a,b)=>rank(a)-rank(b));
    const sec=document.createElement("section");sec.className="group"+(items.some(d=>selected.has(d.id))?"":" nosel");
    sec.innerHTML=`<h2>${esc(k)} <small>${fa(items.length)} مورد</small><button type="button">انتخاب این گروه</button></h2><div class="list"></div>`;
    sec.querySelector("h2 button").onclick=()=>{const all=items.every(d=>selected.has(d.id));items.forEach(d=>all?selected.delete(d.id):selected.add(d.id));save();render()};
    const L=sec.querySelector(".list");
    items.forEach(d=>{
      const c=document.createElement("label");c.className="card"+(selected.has(d.id)?" sel":"");
      c.innerHTML=`<input type="checkbox" ${selected.has(d.id)?"checked":""}><div><h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p><div class="meta"><span class="tag ${prioClass[d.prio]||""}">اولویت ${esc(d.prio)}</span><span class="tag">تلاش ${esc(d.effort)}</span><span class="tag">${esc(d.cat)}</span><span class="tag">${esc(d.area)}</span></div></div>`;
      c.querySelector("input").onchange=e=>{e.target.checked?selected.add(d.id):selected.delete(d.id);save();c.classList.toggle("sel",e.target.checked);sec.classList.toggle("nosel",!items.some(x=>selected.has(x.id)));count()};
      L.appendChild(c);
    });
    main.appendChild(sec);
  });
  count();
}
function count(){$("count").textContent=fa(selected.size)+" مورد از "+fa(DATA.length)+" انتخاب شده"}
function stats(){
  const by=p=>DATA.filter(d=>d.prio===p).length;
  $("stats").innerHTML=`<div class="stat"><b>${fa(DATA.length)}</b><span>کل پیشنهادها</span></div>`+PRIOS.map(p=>`<div class="stat"><b>${fa(by(p))}</b><span>اولویت ${p}</span></div>`).join("")+`<div class="stat"><b>${fa(new Set(DATA.map(d=>d.area)).size)}</b><span>بخش سایت</span></div>`;
}
const picked=()=>DATA.filter(d=>selected.has(d.id));
function need(){if(!selected.size){toast("اول چند مورد را انتخاب کنید");return false}return true}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function asText(){return picked().map((d,i)=>`${fa(i+1)}. ${d.title}\n   ${d.desc}\n   [بخش: ${d.area} | دسته: ${d.cat} | اولویت: ${d.prio} | تلاش: ${d.effort}]`).join("\n\n")}
function asMd(){
  const g=new Map();picked().forEach(d=>{if(!g.has(d.area))g.set(d.area,[]);g.get(d.area).push(d)});
  let s="# پیشنهادهای انتخاب‌شده برای بهبود تجربه کاربری\n\n";
  g.forEach((items,k)=>{s+=`## ${k}\n\n`;items.forEach(d=>{s+=`- [ ] **${d.title}** — ${d.desc} _(اولویت: ${d.prio}، تلاش: ${d.effort}، ${d.cat})_\n`});s+="\n"});
  return s;
}
function asCsv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';return "﻿"+["عنوان,توضیح,بخش,دسته,اولویت,تلاش"].concat(picked().map(d=>[d.title,d.desc,d.area,d.cat,d.prio,d.effort].map(q).join(","))).join("\n")}
$("q").oninput=render;$("sort").onchange=render;
$("all").onclick=()=>{visible().forEach(d=>selected.add(d.id));save();render()};
$("none").onclick=()=>{selected.clear();save();render()};
$("copy").onclick=async()=>{if(!need())return;try{await navigator.clipboard.writeText(asText());toast("کپی شد")}catch(e){toast("کپی ممکن نشد؛ از دانلود استفاده کنید")}};
$("md").onclick=()=>need()&&download("ux-suggestions.md",asMd(),"text/markdown;charset=utf-8");
$("csv").onclick=()=>need()&&download("ux-suggestions.csv",asCsv(),"text/csv;charset=utf-8");
$("json").onclick=()=>need()&&download("ux-suggestions.json",JSON.stringify(picked(),null,2),"application/json");
$("print").onclick=()=>{if(!need())return;document.body.classList.add("print-selected");window.print();setTimeout(()=>document.body.classList.remove("print-selected"),500)};
$("theme").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark"};
stats();render();
</script>
</body>
</html>
