name: Build and push images

# The deploy server (Iran-hosted VPS) cannot reliably reach registry.npmjs.org,
# so `npm ci` fails when the Dockerfile is built there. It CAN reach ghcr.io.
# Building here instead sidesteps that entirely: GitHub's runners have normal
# internet access and are native linux/amd64 (avoiding the QEMU crash we hit
# trying to cross-build linux/amd64 images on an arm64 dev machine). The
# server then just pulls the finished images and runs them.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "docker/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "prisma.config.ts"
      - "next.config.*"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/founders-arena

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runner
            suffix: web
          - target: tools
            suffix: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_BASE }}-${{ matrix.suffix }}:latest,${{ env.IMAGE_BASE }}-${{ matrix.suffix }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
